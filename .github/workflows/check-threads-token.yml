name: 쓰레드 토큰 점검

# 토큰을 갈아끼운 뒤, 글을 올리지 않고 살아 있는지만 확인한다.
# 계정 이름과 id만 찍고 토큰은 출력하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 토큰 확인
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/check-threads-token.mjs
