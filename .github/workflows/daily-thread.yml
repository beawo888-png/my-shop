name: 쓰레드 매일 자동 발행

# 오전 7시(KST) 근처에 확실히 올리기 위한 3중 예약.
# 깃허브 스케줄러는 시각을 보장하지 않는다(실측: 22:00 UTC 예약이 1시간 54분 지연).
# 그래서 한산한 분으로 세 번 나눠 걸어두고, 먼저 도는 실행이 발행한다.
# 나머지 실행은 그날 이미 발행된 것을 보고 스스로 건너뛴다(중복 발행 없음).
#   45 21 UTC = 06:45 KST / 10 22 UTC = 07:10 KST / 35 22 UTC = 07:35 KST
on:
  schedule:
    - cron: "45 21 * * *"
    - cron: "10 22 * * *"
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "올리지 않고 미리보기만"
        type: boolean
        default: false
      source:
        description: "원고 출처"
        type: choice
        options: [auto, bank, ai]
        default: auto

concurrency:
  group: daily-thread
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 원고집 점검
        run: npm run threads:check

      - name: 오늘의 글 발행
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_SOURCE: ${{ inputs.source || 'auto' }}
        run: node scripts/post-daily-thread.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 발행 이력 커밋
        if: success()
        run: |
          if [ -z "$(git status --porcelain data/threads-log.jsonl)" ]; then
            echo "기록할 변경 사항이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threads-log.jsonl
          git commit -m "chore: record daily thread post"
          git push
