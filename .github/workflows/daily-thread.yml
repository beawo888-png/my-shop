name: 쓰레드 매일 자동 발행

# 06:50 KST = 21:50 UTC (전날).
# 깃허브 스케줄러는 정각(:00)에 요청이 몰려 30분~1시간씩 밀리므로, 07:00 정각 대신
# 10분 앞당긴 한산한 분에 예약한다. 지연이 붙어도 오전 7시 언저리에 떨어진다.
on:
  schedule:
    - cron: "50 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "올리지 않고 미리보기만"
        type: boolean
        default: false
      source:
        description: "원고 출처"
        type: choice
        options: [auto, bank, ai]
        default: auto

concurrency:
  group: daily-thread
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 원고집 점검
        run: npm run threads:check

      - name: 오늘의 글 발행
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_SOURCE: ${{ inputs.source || 'auto' }}
        run: node scripts/post-daily-thread.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 발행 이력 커밋
        if: success()
        run: |
          if [ -z "$(git status --porcelain data/threads-log.jsonl)" ]; then
            echo "기록할 변경 사항이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threads-log.jsonl
          git commit -m "chore: record daily thread post"
          git push
